name: DeepBI BE Unit Tests

on:
  workflow_dispatch:
    inputs:
      rc_s3_uri:
        description: 'RC directory, e.g. s3://deep-packages/StarRocks/release-candidates/4.1.6-deepbi2/'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deepbi-be-ut
  queue: max
  cancel-in-progress: false

jobs:
  be-ut:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      # Use the same image for the remote test build
      RUNTIME_IMAGE: starrocks/dev-env-ubuntu:4.1.6@sha256:4ab869d18d1385d29514753b5055177b8a752cf37247cc9cb2241f4ef286ad61
      S3_IMAGE: rustfs/rustfs:1.0.0@sha256:ba0a1b53e36f321c0d46f3867104abef169f7bc59c467c664ddac87e7ddc9a8b
      RC_S3_URI: ${{ inputs.rc_s3_uri }}
      BE_CONTAINER: be-ut-${{ github.run_id }}-${{ github.run_attempt }}
      S3_CONTAINER: be-ut-s3-${{ github.run_id }}-${{ github.run_attempt }}
      UT_NETWORK: be-ut-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Checkout test sources
        uses: actions/checkout@v6
        with:
          path: source
          persist-credentials: false

      - name: Free runner disk for the test bundle
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get clean
          df -h .
          free -h

      - name: Download and verify prebuilt BE tests
        timeout-minutes: 30
        run: |
          [[ "$RC_S3_URI" == s3://deep-packages/?* ]] || { echo 'Expected an RC directory under s3://deep-packages/' >&2; exit 1; }
          rc_url="https://packages.deep.bi/${RC_S3_URI#s3://deep-packages/}"
          name=StarRocks-be-ut-ubuntu-amd64
          base="${rc_url%/}/$name"
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 --connect-timeout 20 "$base.sha256" --output "$name.sha256"
          curl --fail --location --retry 3 --connect-timeout 20 "$base.tar.gz" --output "$name.tar.gz"
          sha256sum --check "$name.sha256"
          tar --extract --gzip --no-same-owner --file "$name.tar.gz" --directory "$GITHUB_WORKSPACE/source"
          rm -- "$name.tar.gz"

      - name: Pull BE test runtime
        run: docker pull "$RUNTIME_IMAGE"

      - name: Start S3 test service
        env:
          AWS_ACCESS_KEY_ID: starrocks
          AWS_SECRET_ACCESS_KEY: starrocks-test-secret
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          docker network create "$UT_NETWORK"
          # Use disposable credentials and expose the fixture only on loopback
          docker run --detach --name "$S3_CONTAINER" \
            --network "$UT_NETWORK" --network-alias s3 \
            --publish 127.0.0.1::9000 \
            --env RUSTFS_ACCESS_KEY=starrocks \
            --env RUSTFS_SECRET_KEY=starrocks-test-secret \
            --env RUSTFS_CONSOLE_ENABLE=false \
            "$S3_IMAGE" /data
          port=$(docker port "$S3_CONTAINER" 9000/tcp | cut -d: -f2)
          endpoint="http://127.0.0.1:$port"
          curl --fail --silent --show-error --retry 30 --retry-delay 2 \
            --retry-all-errors --connect-timeout 2 --max-time 5 "$endpoint/health"
          # AWS CLI is preinstalled on the hosted Ubuntu runner
          aws --endpoint-url "$endpoint" s3api create-bucket --bucket starrocks-fs-s3-ut

      - name: Run prebuilt BE unit tests
        id: be-tests
        timeout-minutes: 330
        run: |
          mkdir -p ut-reports/be
          bash .github/scripts/monitor-be-resources.sh "$RUNNER_TEMP/be-ut-resources.log" \
            "$BE_CONTAINER" "$S3_CONTAINER" &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true; wait "$monitor_pid" 2>/dev/null || true' EXIT
          docker run --init --name "$BE_CONTAINER" \
            --network "container:$S3_CONTAINER" \
            --volume "$GITHUB_WORKSPACE/source:/workspace/starrocks" \
            --volume "$GITHUB_WORKSPACE/ut-reports:/workspace/starrocks/ut-reports" \
            --workdir /workspace/starrocks \
            --env STARROCKS_HOME=/workspace/starrocks \
            --env PYTHON=python3 \
            --env BUILD_TYPE=Debug \
            --env GTEST_PARALLEL= \
            --env GTEST_OPTIONS= \
            --env RUN_FILE= \
            --env GTEST_OUTPUT=xml:/workspace/starrocks/ut-reports/be/ \
            "$RUNTIME_IMAGE" bash -eo pipefail -c '
              source ./env.sh
              cp -a thirdparty-runtime/. "$STARROCKS_THIRDPARTY/installed/"
              java -version
              # Require the S3 fixture before running tests
              curl --fail --silent --show-error --retry 30 --retry-delay 2 \
                --retry-all-errors --connect-timeout 2 --max-time 5 \
                http://127.0.0.1:9000/health
              cat >> conf/be_test.conf <<EOF
          object_storage_access_key_id = starrocks
          object_storage_secret_access_key = starrocks-test-secret
          object_storage_endpoint = http://127.0.0.1:9000
          object_storage_bucket = starrocks-fs-s3-ut
          object_storage_region = us-east-1
          object_storage_endpoint_use_https = false
          object_storage_endpoint_path_style_access = true
          EOF
              ./run-be-ut.sh --run-only --enable-shared-data --with-aws --keep-going
            '

      - name: Clean up container and restore file ownership
        if: always()
        run: |
          docker inspect --format '{{json .State}}' "$BE_CONTAINER" \
            > "$RUNNER_TEMP/be-ut-container-state.json" 2>/dev/null || true
          docker rm --force --volumes "$BE_CONTAINER" >/dev/null 2>&1 || true
          docker logs "$S3_CONTAINER" > "$RUNNER_TEMP/be-ut-s3.log" 2>&1 || true
          docker rm --force --volumes "$S3_CONTAINER" >/dev/null 2>&1 || true
          docker network rm "$UT_NETWORK" >/dev/null 2>&1 || true
          for directory in "$GITHUB_WORKSPACE/source" "$GITHUB_WORKSPACE/ut-reports"; do
            if [[ -d "$directory" ]]; then
              sudo chown -R "$(id -u):$(id -g)" "$directory"
            fi
          done
          df -h .

      - name: Validate BE test reports
        if: ${{ !cancelled() && steps.be-tests.outcome != 'skipped' }}
        run: |
          python3 .github/scripts/check_ut_reports.py --label BE --pattern 'ut-reports/be/*.xml' \
            --output ut-reports/be-summary.json

      - name: Upload BE test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: be-ut-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ut-reports/be/*.xml
            ut-reports/be-summary.json
            ${{ runner.temp }}/be-ut-s3.log
            ${{ runner.temp }}/be-ut-resources.log
            ${{ runner.temp }}/be-ut-container-state.json
          if-no-files-found: warn
          retention-days: 3
          compression-level: 9
