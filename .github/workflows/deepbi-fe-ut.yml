name: DeepBI FE Unit Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deepbi-tests
  queue: max
  cancel-in-progress: false

jobs:
  ci-checks:
    uses: ./.github/workflows/deepbi-ci-checks.yml

  fe-ut:
    needs: ci-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      MAVEN_OPTS: -Xmx2g
      MAVEN_ARGS: --batch-mode --no-transfer-progress --fail-at-end
      THRIFT_VERSION: 0.24.0
      THRIFT_SHA256: e0fa5839a4c5c1d631b0931cf2c554ebbfa4e2fee3a9fb3ffd4f82ce4396c6e4

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ut-maven-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('fe/**/pom.xml', 'java-extensions/**/pom.xml') }}
          restore-keys: |
            ut-maven-${{ runner.os }}-${{ runner.arch }}-

      - name: Check Thrift version
        run: |
          version=$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("fe/pom.xml").findtext("{*}properties/{*}thrift.version"))')
          if [[ "$version" != "$THRIFT_VERSION" ]]; then
            echo "::error::Update the workflow Thrift version and checksum to match fe/pom.xml ($version)."
            exit 1
          fi
          echo "THRIFT=$RUNNER_TEMP/thrift/bin/thrift" >> "$GITHUB_ENV"

      - name: Cache Thrift compiler
        id: thrift-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/thrift
          key: ut-thrift-ubuntu-24.04-${{ runner.arch }}-${{ env.THRIFT_VERSION }}-${{ env.THRIFT_SHA256 }}

      - name: Build Thrift compiler
        if: steps.thrift-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bison flex libboost-dev
          archive="$RUNNER_TEMP/thrift-$THRIFT_VERSION.tar.gz"
          curl --fail --location --retry 3 \
            "https://archive.apache.org/dist/thrift/$THRIFT_VERSION/thrift-$THRIFT_VERSION.tar.gz" \
            --output "$archive"
          echo "$THRIFT_SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          cmake -S "$RUNNER_TEMP/thrift-$THRIFT_VERSION" -B "$RUNNER_TEMP/thrift-build" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/thrift" \
            -DBUILD_COMPILER=ON -DBUILD_LIBRARIES=OFF -DBUILD_TESTING=OFF -DBUILD_TUTORIALS=OFF
          cmake --build "$RUNNER_TEMP/thrift-build" --parallel 2
          cmake --install "$RUNNER_TEMP/thrift-build"

      - name: Run FE unit tests
        id: fe-tests
        timeout-minutes: 330
        run: |
          "$THRIFT" --version
          java -version
          df -h .
          free -h
          ./run-fe-ut.sh -j 2

      - name: Run Java-extension unit tests
        id: java-tests
        if: ${{ !cancelled() && (steps.fe-tests.outcome == 'success' || steps.fe-tests.outcome == 'failure') }}
        run: ./run-java-exts-ut.sh

      - name: Validate FE test reports
        if: ${{ !cancelled() && steps.fe-tests.outcome != 'skipped' }}
        run: |
          python3 .github/scripts/check_ut_reports.py --label FE --pattern 'fe/**/target/surefire-reports/TEST-*.xml' \
            --output ut-reports/fe-summary.json

      - name: Validate Java-extension test reports
        if: ${{ !cancelled() && steps.java-tests.outcome != 'skipped' }}
        run: |
          python3 .github/scripts/check_ut_reports.py --label Java-extensions \
            --pattern 'java-extensions/**/target/surefire-reports/TEST-*.xml' \
            --output ut-reports/java-summary.json

      - name: Upload FE test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fe-ut-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ut-reports/*-summary.json
            fe/**/target/surefire-reports/*.xml
            fe/**/target/surefire-reports/*.txt
            fe/**/target/surefire-reports/*.dump*
            java-extensions/**/target/surefire-reports/*.xml
            java-extensions/**/target/surefire-reports/*.txt
            java-extensions/**/target/surefire-reports/*.dump*
          if-no-files-found: warn
          retention-days: 3
          compression-level: 9
